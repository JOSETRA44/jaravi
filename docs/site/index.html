<script>
  // Antes de pintar: el tema elegido gana al del sistema, y ninguno de los dos
  // puede provocar un flash de la paleta contraria.
  (function () {
    try {
      var stored = localStorage.getItem('jaravi-theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { /* almacenamiento bloqueado: se queda en dark */ }
  })();
</script>
